async function doImport() {
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.textContent = '⏳ Importing...';
  try {
    log('Authenticating...');
    await firebase.auth().signInAnonymously();
    log('✓ Authenticated', 'ok');
    log('Writing ' + IMPORT_STATE.invoices.length + ' entries to Firebase...');
    await db.ref('invoices').set(IMPORT_STATE);
    const paid    = IMPORT_STATE.invoices.filter(i=>i.status==='paid').length;
    const partial = IMPORT_STATE.invoices.filter(i=>i.status==='partial').length;
    const unpaid  = IMPORT_STATE.invoices.filter(i=>i.status==='unpaid').length;
    log('✓ Done! ' + IMPORT_STATE.invoices.length + ' entries imported.', 'ok');
    log('  Paid: ' + paid + '  |  Partial: ' + partial + '  |  Unpaid: ' + unpaid, 'ok');

    btn.textContent = '✓ Import Complete';
  } catch(e) {
    log('Error: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '🚀 Retry Import';
  }
}
