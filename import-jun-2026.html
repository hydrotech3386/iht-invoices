async function doImport(){
  const btn=document.getElementById('importBtn');
  btn.disabled=true;btn.textContent='Working...';
  try{
    log('Authenticating...');
    await firebase.auth().signInAnonymously();
    log('Authenticated','ok');
    log('Reading existing Firebase data...');
    const snap=await db.ref('invoices').get();
    const existing=snap.val()||{invoices:[],salesmen:['Jack','Kamal','Helmi','Faris'],lastModified:Date.now()};
    const existingNos=new Set((existing.invoices||[]).map(i=>i.invoiceNo));
    log('Existing entries: '+existingNos.size,'ok');
    const now=Date.now();
    const newEntries=JUN_RAW.filter(r=>!existingNos.has(r.invNo)).map((r,i)=>({
      id:uid(i),invoiceNo:r.invNo,projectRef:'',invoiceDate:r.invoiceDate,term:r.term,
      customer:r.customer,contact:'',amount:r.amount,sst:0,salesman:r.salesman,
      notes:'',status:'unpaid',payments:[],
      createdAt:now-(JUN_RAW.length-i)*60000,updatedAt:now-(JUN_RAW.length-i)*60000
    }));
    const skipped=JUN_RAW.length-newEntries.length;
    if(skipped)log('Skipped (already exist): '+skipped,'info');
    const merged={invoices:[...(existing.invoices||[]),...newEntries],salesmen:existing.salesmen||['Jack','Kamal','Helmi','Faris'],lastModified:now};
    log('Writing '+newEntries.length+' new entries...');
    await db.ref('invoices').set(merged);
    log('Done! Added '+newEntries.length+' June entries.','ok');
    log('Total in database: '+merged.invoices.length,'ok');
    log('Close this page and open Invoice Tracker.','info');
    btn.textContent='Import Complete';
  }catch(e){
    log('Error: '+e.message,'err');
    btn.disabled=false;btn.textContent='Retry';
  }
}
